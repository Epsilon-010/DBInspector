services:
  postgres:
    image: postgres:16-alpine
    container_name: dbinspector_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dbinspector_admin
      POSTGRES_PASSWORD: dbinspector_admin_pw
      POSTGRES_DB: dbinspector
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbinspector_admin -d dbinspector"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: dbinspector_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: "postgresql+asyncpg://dbinspector_ro:dbinspector_ro_pw@postgres:5432/chinook"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/health\").read()'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  frontend:
    build:
      context: ./frontend
    container_name: dbinspector_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  postgres_data:
    name: dbinspector_postgres_data
