# Pass through WebSocket upgrade headers correctly.
# This map MUST live at http-level — conf.d files are included there, so it's fine here.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 256;

    # Reverse-proxy /graphql to the backend service. Same `location` handles GET/POST
    # (queries/mutations) and WS (subscriptions) — the Upgrade/Connection headers make
    # nginx pass through the WebSocket handshake transparently.
    location /graphql {
        proxy_pass http://backend:8000/graphql;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600;  # subscriptions stay open until the pipeline closes
        proxy_buffering off;
    }

    location /health {
        proxy_pass http://backend:8000/health;
    }

    # SPA fallback — unknown paths return index.html (lets React Router work if added later).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
